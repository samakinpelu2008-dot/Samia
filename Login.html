<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPE Login/Register</title>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
  }

  /* Banner container */
  .banner-container {
    width: 100%;
    overflow: hidden;
    position: relative;
  }

  .banner-container img {
    width: 50%;
    height: auto;
    display: block;
    object-fit: cover; /* ensures full width without squishing */
  }

  /* Top bar over banner */
  .top-bar-banner {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: transparent; /* transparent over banner */
  }

  .top-bar-banner .logo {
    height: 50px;
    width: auto;
    z-index: 2;
  }

  .top-bar-banner .back-icon {
    position: absolute;
    left: 15px;
    cursor: pointer;
    z-index: 2;
  }

  .back-icon svg {
    width: 30px;
    height: 30px;
    stroke: white;
  }

  /* Sign In / Register toggle bar */
  .toggle-bar {
    display: flex;
    width: 100%;
    height: 60px;
    margin-top: -1px; /* remove any gap from banner */
    border: 1px solid #A2001D; /* dark red edges */
  }

  .toggle-tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.3s, color 0.3s;
  }

  .toggle-tab.active {
    background-color: #DA291C; /* thick red for active */
    color: #fff7f7;
  }

  .toggle-tab.inactive {
    background-color: #fff; /* white for inactive */
    color: #DA291C; /* thick red text */
  }

  /* Input container */
  .input-container {
    margin: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .input-container input {
    padding: 12px 15px;
    font-size: 16px;
    border-radius: 4px;
    border: none;
    background-color: #FFE5E5; /* light red background */
  }

  .password-wrapper {
    position: relative;
  }

  .password-wrapper i {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    stroke: #DA291C;
  }

  /* Forgot password */
  .forgot-password {
    margin: 0 20px;
    font-size: 14px;
    color: #DA291C;
    cursor: pointer;
    text-decoration: underline;
  }

  /* Action button */
  .action-btn {
    margin: 20px;
    padding: 12px;
    font-size: 18px;
    font-weight: bold;
    background-color: #DA291C;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  /* Info card */
  .info-card {
    margin: 0 20px 20px 20px;
    padding: 12px;
    background-color: #FFD6D6; /* lighter red */
    border-left: 5px solid #DA291C;
    font-size: 14px;
    color: #DA291C;
  }

</style>
</head>
<body>

  <!-- Banner -->
  <div class="banner-container">
    <img src="https://i.ibb.co/67JVHGGR/file-00000000451072469555c89659f31eb3.png" alt="Banner">
    
    <!-- Top bar with logo and back icon -->
    <div class="top-bar-banner">
      <i data-lucide="chevron-left" class="back-icon" onclick="goBack()"></i>
      <img src="https://i.ibb.co/pBYWJ1F6/1000208244.png" class="logo" alt="Logo">
    </div>
  </div>

  <!-- Sign In / Register Toggle Bar -->
  <div class="toggle-bar">
    <div class="toggle-tab active" id="signInTab" onclick="toggleTab('signin')">SIGN IN</div>
    <div class="toggle-tab inactive" id="registerTab" onclick="toggleTab('register')">REGISTER</div>
  </div>

  <!-- Input form -->
  <div class="input-container" id="formContainer">
    <!-- Sign In fields -->
    <input type="email" placeholder="Email Address" id="email">
    <div class="password-wrapper">
      <input type="password" placeholder="Password" id="password">
      <i data-lucide="eye" onclick="togglePassword()"></i>
    </div>
    <div class="forgot-password" onclick="goForgot()">Forgot your password?</div>
    <button class="action-btn">SIGN IN</button>
  </div>

  <!-- Info Card -->
  <div class="info-card">
    Do well to login with your email and use the password you'll easily remember to avoid problems in the future.
  </div>

<script>
  lucide.createIcons();

  function goBack() {
    window.history.back(); // Returns to previous page (home)
  }

  function togglePassword() {
    const pwd = document.getElementById('password');
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
  }

  function toggleTab(tab) {
    const signInTab = document.getElementById('signInTab');
    const registerTab = document.getElementById('registerTab');
    const formContainer = document.getElementById('formContainer');

    if(tab === 'signin') {
      signInTab.classList.add('active'); signInTab.classList.remove('inactive');
      registerTab.classList.add('inactive'); registerTab.classList.remove('active');
      formContainer.innerHTML = `
        <input type="email" placeholder="Email Address" id="email">
        <div class="password-wrapper">
          <input type="password" placeholder="Password" id="password">
          <i data-lucide="eye" onclick="togglePassword()"></i>
        </div>
        <div class="forgot-password" onclick="goForgot()">Forgot your password?</div>
        <button class="action-btn">SIGN IN</button>
      `;
      lucide.createIcons();
    } else {
      signInTab.classList.add('inactive'); signInTab.classList.remove('active');
      registerTab.classList.add('active'); registerTab.classList.remove('inactive');
      formContainer.innerHTML = `
        <input type="email" placeholder="Email Address" id="email">
        <div class="password-wrapper">
          <input type="password" placeholder="Password" id="password">
          <i data-lucide="eye" onclick="togglePassword()"></i>
        </div>
        <div class="password-wrapper">
          <input type="password" placeholder="Confirm Password" id="confirmPassword">
          <i data-lucide="eye" onclick="togglePassword()"></i>
        </div>
        <button class="action-btn">REGISTER</button>
      `;
      lucide.createIcons();
    }
  }

  function goForgot() {
    alert("Redirect to forgot password page");
  }
</script>

</body>
</html>
