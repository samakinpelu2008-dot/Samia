<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPE Department App - Login/Register</title>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
  }

  /* Banner image */
  .banner {
    width: 100%;
    height: auto;
    max-height: 400px; /* adjust max height as needed */
    object-fit: cover;
    display: block;
  }

  /* Top bar for login/register pages */
  .topbar-login {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    height: 60px;
    background-color: #fff;
  }

  .topbar-login .logo {
    height: 50px;
    width: auto;
  }

  .topbar-login .back-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    stroke: #DA291C;
    width: 24px;
    height: 24px;
  }

  /* Sign In / Register toggle bar */
  .toggle-bar {
    display: flex;
    margin: 0;
    padding: 0;
    height: 50px;
    border-top: 2px solid #DA291C;
    border-bottom: 2px solid #DA291C;
  }

  .toggle-bar div {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    cursor: pointer;
    font-size: 18px;
  }

  .toggle-bar .active {
    background-color: #DA291C;
    color: #f4f6f9;
  }

  .toggle-bar .inactive {
    background-color: #fff;
    color: #DA291C;
  }

  /* Form container */
  .form-container {
    padding: 20px;
  }

  .form-container label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
    color: #DA291C;
  }

  .form-container input {
    width: 100%;
    padding: 12px 10px;
    margin-bottom: 15px;
    border: 1px solid #DA291C;
    border-radius: 5px;
    font-size: 16px;
    box-sizing: border-box;
  }

  /* Password wrapper for eye icon */
  .password-wrapper {
    position: relative;
  }

  .password-wrapper input {
    padding-right: 50px; /* space for eye icon */
  }

  .password-wrapper .eye-icon {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    width: 35px;
    height: 35px;
    background-color: #ffcccc;
    border-radius: 0 5px 5px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  .password-wrapper .eye-icon svg {
    stroke: #DA291C;
    width: 20px;
    height: 20px;
  }

  /* Submit button */
  .submit-btn {
    width: 100%;
    padding: 12px;
    background-color: #DA291C;
    color: #fff;
    font-weight: bold;
    border: none;
    border-radius: 5px;
    font-size: 18px;
    cursor: pointer;
  }

  /* Info card */
  .info-card {
    margin-top: 15px;
    padding: 10px;
    background-color: #ffcccc;
    border-left: 5px solid #DA291C;
    color: #DA291C;
    font-size: 14px;
  }

  /* Forgot password link */
  .forgot-link {
    display: block;
    text-align: right;
    margin-bottom: 15px;
    color: #DA291C;
    text-decoration: none;
  }

</style>
</head>
<body>

  <!-- Banner -->
  <img src="https://i.ibb.co/C3sNb445/file-00000000451072469555c89659f31eb3.png" alt="Banner" class="banner">

  <!-- Top bar with logo and back button -->
  <div class="topbar-login">
    <i data-lucide="chevron-left" class="back-icon" onclick="goBack()"></i>
    <img src="https://i.ibb.co/pBYWJ1F6/1000208244.png" class="logo">
  </div>

  <!-- Sign In / Register toggle -->
  <div class="toggle-bar">
    <div id="signInTab" class="active" onclick="switchTab('signIn')">SIGN IN</div>
    <div id="registerTab" class="inactive" onclick="switchTab('register')">REGISTER</div>
  </div>

  <!-- Form container -->
  <div class="form-container" id="signInForm">
    <label>Email Address</label>
    <input type="email" placeholder="Email Address">

    <label>Password</label>
    <div class="password-wrapper">
      <input type="password" placeholder="Password">
      <div class="eye-icon" onclick="togglePassword(this)">
        <i data-lucide="eye"></i>
      </div>
    </div>

    <a href="forgot.html" class="forgot-link">Forgot your password?</a>

    <div class="info-card">
      Do well to login with your email and use the password you'll easily remember to avoid problems in the future.
    </div>

    <button class="submit-btn">SIGN IN</button>
  </div>

  <div class="form-container" id="registerForm" style="display:none;">
    <label>Email Address</label>
    <input type="email" placeholder="Email Address">

    <label>Password</label>
    <div class="password-wrapper">
      <input type="password" placeholder="Password">
      <div class="eye-icon" onclick="togglePassword(this)">
        <i data-lucide="eye"></i>
      </div>
    </div>

    <label>Confirm Password</label>
    <div class="password-wrapper">
      <input type="password" placeholder="Confirm Password">
      <div class="eye-icon" onclick="togglePassword(this)">
        <i data-lucide="eye"></i>
      </div>
    </div>

    <div class="info-card">
      By submitting your details, you agree to the use of your data by CPE Football Group in accordance with our Privacy Policy.
    </div>

    <button class="submit-btn">REGISTER</button>
  </div>

<script>
  lucide.createIcons();

  function switchTab(tab) {
    if(tab === 'signIn') {
      document.getElementById('signInForm').style.display = 'block';
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('signInTab').classList.add('active');
      document.getElementById('signInTab').classList.remove('inactive');
      document.getElementById('registerTab').classList.add('inactive');
      document.getElementById('registerTab').classList.remove('active');
    } else {
      document.getElementById('signInForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
      document.getElementById('signInTab').classList.add('inactive');
      document.getElementById('signInTab').classList.remove('active');
      document.getElementById('registerTab').classList.add('active');
      document.getElementById('registerTab').classList.remove('inactive');
    }
  }

  function togglePassword(iconDiv) {
    const input = iconDiv.previousElementSibling;
    if(input.type === 'password') {
      input.type = 'text';
    } else {
      input.type = 'password';
    }
  }

  function goBack() {
    window.history.back();
  }
</script>

</body>
</html>
