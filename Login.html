<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPE Department - Login/Register</title>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide/dist/lucide.min.js"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
  }

  /* === Top Bar === */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #DA291C;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
    color: white;
  }

  .topbar .return-icon {
    position: absolute;
    left: 15px;
    cursor: pointer;
  }

  .topbar .logo {
    height: 45px;
    width: auto;
  }

  /* === Banner Image === */
  .banner {
    width: 100%;
    max-width: 1536px;
    margin: 0 auto;
  }
  .banner img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
  }

  /* === Sign In / Register Toggle Bar === */
  .toggle-bar {
    display: flex;
    height: 50px;
    border: 2px solid #B71C1C; /* dark red border */
    margin: 0;
  }
  .toggle-bar div {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
    cursor: pointer;
  }
  .toggle-bar .active {
    background-color: #B71C1C; /* thick red */
    color: #FFCDD2; /* light red text */
  }
  .toggle-bar .inactive {
    background-color: white;
    color: #B71C1C; /* thick red text */
  }

  /* === Form Container === */
  .form-container {
    padding: 20px;
    max-width: 500px;
    margin: 20px auto;
  }

  .input-group {
    display: flex;
    margin-bottom: 20px;
  }

  .input-group input {
    flex: 0 0 80%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #B71C1C;
    border-right: none;
    border-radius: 5px 0 0 5px;
    outline: none;
  }

  .input-group .eye-container {
    flex: 0 0 20%;
    background-color: #FFCDD2;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #B71C1C;
    border-left: none;
    border-radius: 0 5px 5px 0;
    cursor: pointer;
  }

  /* Forgot Password */
  .forgot-password {
    text-align: right;
    margin-bottom: 20px;
    color: #B71C1C;
    font-size: 14px;
    cursor: pointer;
  }

  /* Buttons */
  .submit-btn {
    width: 100%;
    padding: 12px;
    background-color: #B71C1C;
    color: white;
    font-weight: bold;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  /* Info Card */
  .info-card {
    background-color: #FFCDD2;
    border-left: 5% solid #B71C1C;
    padding: 15px;
    margin-top: 15px;
    font-size: 14px;
    color: #B71C1C;
    border-radius: 5px;
  }

  /* Responsive */
  @media (max-width: 500px) {
    .form-container {
      margin: 10px;
    }
    .toggle-bar div {
      font-size: 16px;
    }
  }
</style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="return-icon" onclick="goHome()">
      <i data-lucide="chevron-left"></i>
    </div>
    <img src="https://i.ibb.co/pBYWJ1F6/1000208244.png" class="logo">
  </div>

  <!-- Banner Image -->
  <div class="banner">
    <img src="https://i.ibb.co/C3sNb445/file-00000000451072469555c89659f31eb3.png" alt="Banner">
  </div>

  <!-- Sign In / Register Toggle -->
  <div class="toggle-bar">
    <div id="signinTab" class="active" onclick="switchTab('signin')">SIGN IN</div>
    <div id="registerTab" class="inactive" onclick="switchTab('register')">REGISTER</div>
  </div>

  <!-- Form Container -->
  <div class="form-container">
    <div id="signinForm">
      <div class="input-group">
        <input type="email" placeholder="Email Address">
      </div>
      <div class="input-group">
        <input type="password" placeholder="Password">
        <div class="eye-container">
          <i data-lucide="eye"></i>
        </div>
      </div>
      <div class="forgot-password">Forgot Password?</div>
      <button class="submit-btn">SIGN IN</button>
      <div class="info-card">
        Do well to login with your email and use a password you'll easily remember to avoid problems in the future.
      </div>
    </div>

    <div id="registerForm" style="display:none;">
      <div class="input-group">
        <input type="email" placeholder="Email Address">
      </div>
      <div class="input-group">
        <input type="password" placeholder="Password">
        <div class="eye-container">
          <i data-lucide="eye"></i>
        </div>
      </div>
      <div class="input-group">
        <input type="password" placeholder="Confirm Password">
        <div class="eye-container">
          <i data-lucide="eye"></i>
        </div>
      </div>
      <button class="submit-btn">REGISTER</button>
      <div class="info-card">
        By submitting your details, you agree to the use of your data by CPE Football Group in accordance with our Privacy Policy.
      </div>
    </div>
  </div>

<script>
  lucide.createIcons();

  function switchTab(tab) {
    if(tab === 'signin') {
      document.getElementById('signinForm').style.display = 'block';
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('signinTab').classList.add('active');
      document.getElementById('signinTab').classList.remove('inactive');
      document.getElementById('registerTab').classList.add('inactive');
      document.getElementById('registerTab').classList.remove('active');
    } else {
      document.getElementById('signinForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
      document.getElementById('registerTab').classList.add('active');
      document.getElementById('registerTab').classList.remove('inactive');
      document.getElementById('signinTab').classList.add('inactive');
      document.getElementById('signinTab').classList.remove('active');
    }
  }

  function goHome() {
    window.location.href = 'index.html';
  }
</script>

</body>
      </html>
