<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Register - CPE Department App</title>

<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
  }

  /* Top Bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    background-color: #DA291C;
    padding: 10px 15px;
    color: white;
  }

  .topbar .logo {
    height: 45px;
    margin: 0 auto;
  }

  .return-icon {
    cursor: pointer;
    margin-right: 10px;
  }

  /* Form Container */
  .form-container {
    padding: 20px;
    max-width: 400px;
    margin: 20px auto;
  }

  /* Sign In / Register Bar */
  .toggle-bar {
    display: flex;
    border: 2px solid #8B0000;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .toggle-bar div {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    font-weight: bold;
    cursor: pointer;
  }

  .toggle-bar .active-signin {
    background-color: white;
    color: #DA291C;
  }

  .toggle-bar .active-register {
    background-color: #DA291C;
    color: #FF6B6B;
  }

  /* Input fields */
  .input-group {
    display: flex;
    margin-bottom: 15px;
  }

  .input-group input {
    flex: 1;
    padding: 10px;
    border: 2px solid #DA291C;
    border-right: none;
    border-radius: 5px 0 0 5px;
    font-size: 16px;
  }

  .eye-container {
    flex: 0 0 15%;
    background-color: #FF6B6B;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 0 5px 5px 0;
    cursor: pointer;
  }

  .eye-container i {
    color: white;
  }

  .forgot-password {
    text-align: right;
    font-size: 14px;
    color: #DA291C;
    cursor: pointer;
    margin-bottom: 20px;
  }

  .submit-btn {
    width: 100%;
    background-color: #DA291C;
    color: white;
    font-weight: bold;
    padding: 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-bottom: 15px;
  }

  .info-card {
    background-color: #FF6B6B;
    padding: 10px;
    border-left: 5px solid #DA291C;
    color: #DA291C;
    font-size: 14px;
    border-radius: 3px;
  }
</style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="return-icon" onclick="goHome()">
      <i data-lucide="chevron-left"></i>
    </div>
    <img src="https://i.ibb.co/C3sNb445/file-00000000451072469555c89659f31eb3.png" class="logo">
  </div>

  <div class="form-container">

    <!-- Toggle Sign In / Register -->
    <div class="toggle-bar">
      <div id="signinToggle" class="active-signin" onclick="showSignIn()">SIGN IN</div>
      <div id="registerToggle" onclick="showRegister()">REGISTER</div>
    </div>

    <!-- Sign In Form -->
    <div id="signinForm">
      <div class="input-group">
        <input type="email" placeholder="Email Address">
      </div>

      <div class="input-group">
        <input type="password" placeholder="Password">
        <div class="eye-container" onclick="togglePassword()">
          <i data-lucide="eye"></i>
        </div>
      </div>

      <div class="forgot-password" onclick="forgotPassword()">Forgot Password?</div>

      <button class="submit-btn">SIGN IN</button>

      <div class="info-card">
        Do well to login with your email and use a password you'll easily remember to avoid problems in the future.
      </div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display:none;">
      <div class="input-group">
        <input type="email" placeholder="Email Address">
      </div>

      <div class="input-group">
        <input type="password" placeholder="Password">
        <div class="eye-container" onclick="togglePassword('register')">
          <i data-lucide="eye"></i>
        </div>
      </div>

      <div class="input-group">
        <input type="password" placeholder="Confirm Password">
        <div class="eye-container" onclick="togglePassword('confirm')">
          <i data-lucide="eye"></i>
        </div>
      </div>

      <div class="info-card">
        By submitting your details, you agree to the use of your data by CPE Football Group in accordance with our Privacy Policy.
      </div>

      <button class="submit-btn">REGISTER</button>
    </div>

  </div>

<script>
  lucide.createIcons();

  function goHome() {
    window.location.href = 'index.html';
  }

  function showSignIn() {
    document.getElementById('signinForm').style.display = 'block';
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('signinToggle').classList.add('active-signin');
    document.getElementById('signinToggle').classList.remove('active-register');
    document.getElementById('registerToggle').classList.remove('active-register');
    document.getElementById('registerToggle').classList.remove('active-signin');
  }

  function showRegister() {
    document.getElementById('signinForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
    document.getElementById('registerToggle').classList.add('active-register');
    document.getElementById('registerToggle').classList.remove('active-signin');
    document.getElementById('signinToggle').classList.remove('active-signin');
    document.getElementById('signinToggle').classList.remove('active-register');
  }

  function togglePassword(type) {
    let input;
    if(type === 'register') input = document.querySelector('#registerForm input[type="password"]:first-of-type');
    else if(type === 'confirm') input = document.querySelector('#registerForm input[type="password"]:last-of-type');
    else input = document.querySelector('#signinForm input[type="password"]');
    
    if(input.type === 'password') input.type = 'text';
    else input.type = 'password';
  }

  function forgotPassword() {
    alert("Redirect to forgot password page (implement later).");
  }
</script>

</body>
</html>
