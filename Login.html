<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPE Department App - Login/Register</title>

<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.6.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDNaZ82JpMfErW4VOB-DiOQ9KwQZlKAly4",
    authDomain: "cpe-department-app.firebaseapp.com",
    projectId: "cpe-department-app",
    storageBucket: "cpe-department-app.firebasestorage.app",
    messagingSenderId: "163479858146",
    appId: "1:163479858146:web:89e2894febc15a5f45e7bb"
  };

  const app = initializeApp(firebaseConfig);
  window.auth = getAuth(app); // make auth globally available
</script>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
  }

  /* Top header with logo + back button */
  .top-header {
    position: relative;
    width: 100%;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #DA291C;
  }

  .top-header img {
    height: 40px;
    width: auto;
  }

  .back-icon {
    position: absolute;
    left: 15px;
    cursor: pointer;
    stroke: white;
  }

  /* Banner image */
  .banner {
    width: 100%;
    height: auto;
  }

  /* SignIn/Register toggle bar */
  .toggle-bar {
    display: flex;
    margin-top: 10px;
    height: 50px;
    width: 100%;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .toggle-bar div {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    font-weight: bold;
    font-size: 18px;
  }

  .toggle-bar .active {
    background-color: #DA291C;
    color: #fff;
  }

  .toggle-bar .inactive {
    background-color: #fff;
    color: #DA291C;
  }

  /* Form styling */
  form {
    max-width: 400px;
    margin: 20px auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #DA291C;
    border-radius: 5px;
    font-size: 16px;
  }

  .password-container {
    position: relative;
  }

  .password-container .eye-icon {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    stroke: #DA291C;
  }

  /* Forgot password link */
  .forgot-link {
    text-align: right;
    font-size: 14px;
    color: #DA291C;
    text-decoration: underline;
    cursor: pointer;
  }

  /* Info card */
  .info-card {
    background-color: #f8d7da;
    border-left: 5px solid #DA291C;
    padding: 10px;
    font-size: 14px;
    color: #DA291C;
    border-radius: 5px;
    max-width: 400px;
    margin: 10px auto;
  }

  /* Submit button */
  .submit-btn {
    background-color: #DA291C;
    color: #fff;
    font-weight: bold;
    font-size: 18px;
    padding: 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  .submit-btn:hover {
    background-color: #b71c1c;
  }

</style>
</head>
<body>

<!-- Top header -->
<div class="top-header">
  <img src="https://i.ibb.co/pBYWJ1F6/1000208244.png" alt="CPE Logo">
  <div class="back-icon" onclick="goBack()">
    <i data-lucide="chevron-left"></i>
  </div>
</div>

<!-- Banner image -->
<img class="banner" src="https://i.ibb.co/67JVHGGR/file-00000000451072469555c89659f31eb3.png" alt="Banner">

<!-- SignIn/Register toggle -->
<div class="toggle-bar">
  <div id="signInTab" class="active" onclick="switchTab('signin')">SIGN IN</div>
  <div id="registerTab" class="inactive" onclick="switchTab('register')">REGISTER</div>
</div>

<!-- SignIn Form -->
<form id="signinForm">
  <input type="email" id="signinEmail" placeholder="Email Address" required>
  <div class="password-container">
    <input type="password" id="signinPassword" placeholder="Password" required>
    <i data-lucide="eye" class="eye-icon" onclick="togglePassword('signinPassword')"></i>
  </div>
  <div class="forgot-link" onclick="goToForgot()">Forgot Password?</div>
  <div class="info-card">
    Do well to login with your email and use the password you'll easily remember to avoid problems in the future.
