<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPE Department App - Navbar</title>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide/dist/lucide.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
    }

    /* Top Navbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #DA291C;
      padding: 10px 15px;
      color: white;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .left-section, .center-section, .right-section {
      display: flex;
      align-items: center;
    }

    /* Hamburger menu */
    .hamburger {
      font-size: 24px;
      cursor: pointer;
      margin-right: 10px;
    }

    /* Center section */
    .center-section {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
    }

    .logo {
      height: 50px;
      width: auto;
      margin-right: 15px;
    }

    .club-name {
      font-size: 22px;
      font-weight: bold;
      font-family: 'Arial Black', Gadget, sans-serif;
      text-align: center;
    }

    /* Right section account icon */
    .right-section .account {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid white;
    }

    .account img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Responsive adjustments */
    @media screen and (max-width: 500px) {
      .logo {
        height: 40px;
      }

      .club-name {
        font-size: 18px;
      }

      .account {
        width: 30px;
        height: 30px;
      }
    }

    /* Icon styling for lucide */
    .lucide-icon {
      width: 24px;
      height: 24px;
      color: white;
      cursor: pointer;
      margin-left: 10px;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="left-section">
      <div class="hamburger">&#9776;</div>
      <i data-lucide="search" class="lucide-icon"></i>
    </div>

    <div class="center-section">
      <div class="logo-container">
        <img src="https://i.ibb.co/pBYWJ1F6/1000208244.png" alt="Club Logo" class="logo">
        <div class="club-name">CPE</div>
      </div>
    </div>

    <div class="right-section">
      <div class="account" onclick="handleAccountClick()">
        <img src="https://i.ibb.co/0sZgxFD/profile-placeholder.png" alt="Account">
      </div>
    </div>
  </div>

  <div style="padding:20px;">
    <p>Scroll down to test sticky navbar.</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>
    <p style="margin-bottom:1000px;"></p>
  </div>

  <script>
    // Activate Lucide icons
    lucide.replace();

    function handleAccountClick() {
      alert("Account clicked. Later will redirect to login/dashboard.");
    }
  </script>

</body>
</html>
