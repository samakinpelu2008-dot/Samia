<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPE Department App - Full Hamburger Menu</title>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide/dist/lucide.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
    }

    /* Navbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #DA291C;
      padding: 10px 15px;
      color: white;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .left-section, .center-section, .right-section {
      display: flex;
      align-items: center;
    }

    .hamburger {
      font-size: 24px;
      cursor: pointer;
      margin-right: 10px;
    }

    .center-section {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
    }

    .logo {
      height: 50px;
      width: auto;
      margin-right: 15px;
    }

    .club-name {
      font-size: 22px;
      font-weight: bold;
      font-family: 'Arial Black', Gadget, sans-serif;
      text-align: center;
    }

    .right-section .account {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid white;
    }

    .account img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Full-page hamburger menu */
    .hamburger-menu {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #DA291C;
      color: white;
      z-index: 999;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
      overflow-y: auto;
    }

    .hamburger-menu.active {
      display: flex;
    }

    /* Menu top section with logo and close icon */
    .menu-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
    }

    .menu-top .close-icon {
      font-size: 28px;
      cursor: pointer;
    }

    .menu-logo-container {
      display: flex;
      align-items: center;
    }

    .menu-logo-container .logo {
      height: 50px;
      width: auto;
      margin-right: 10px;
    }

    .separator {
      width: 80%;
      height: 2px;
      background-color: white;
      margin: 10px 0 20px 0;
    }

    /* Menu items */
    .menu-items {
      display: flex;
      flex-direction: column;
      gap: 20px;
      font-size: 22px;
      text-align: center;
    }

    .menu-items a {
      color: white;
      text-decoration: none;
      transition: color 0.2s;
    }

    .menu-items a:hover {
      color: #FFD700; /* optional hover effect */
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="topbar">
    <div class="left-section">
      <div class="hamburger" onclick="openMenu()">&#9776;</div>
    </div>

    <div class="center-section">
      <div class="logo-container">
        <img src="https://i.ibb.co/pBYWJ1F6/1000208244.png" alt="Club Logo" class="logo">
        <div class="club-name">CPE</div>
      </div>
    </div>

    <div class="right-section">
      <div class="account" onclick="handleAccountClick()">
        <img src="https://i.ibb.co/0sZgxFD/profile-placeholder.png" alt="Account">
      </div>
    </div>
  </div>

  <!-- Full-page Hamburger Menu -->
  <div class="hamburger-menu" id="hamburgerMenu">
    <div class="menu-top">
      <div class="menu-logo-container">
        <img src="https://i.ibb.co/pBYWJ1F6/1000208244.png" alt="Club Logo" class="logo">
      </div>
      <div class="close-icon" onclick="closeMenu()">
        <i data-lucide="x"></i>
      </div>
    </div>
    <div class="separator"></div>
    <div class="menu-items">
      <a href="#">Home</a>
      <a href="#">News</a>
      <a href="#">Fixtures</a>
      <a href="#">Results</a>
      <a href="#">Live</a>
      <a href="#">Chat Hall</a>
      <a href="#">CpeTV</a>
      <a href="#">Players</a>
      <a href="#">FANS</a>
      <a href="#">CPE GIRLS</a>
      <a href="#">JOIN THE TEAM</a>
    </div>
  </div>

  <div style="padding:20px;">
    <p>Scroll down to test sticky navbar and hamburger menu.</p>
    <p>Lorem ipsum dolor sit amet...</p>
  </div>

  <script>
    // Activate Lucide icons
    lucide.replace();

    function openMenu() {
      document.getElementById('hamburgerMenu').classList.add('active');
    }

    function closeMenu() {
      document.getElementById('hamburgerMenu').classList.remove('active');
    }

    function handleAccountClick() {
      alert("Account clicked. Later will redirect to login/dashboard.");
    }
  </script>

</body>
</html>
