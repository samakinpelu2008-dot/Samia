<!DOCTYPE html>
<html>
<head>
  <title>Live Football</title>
</head>
<body>

<h2>Live Football Matches</h2>
<div id="matches"></div>

<script>
fetch("https://api.sportsrc.org/?data=matches&category=football")
.then(response => response.json())
.then(data => {
    let container = document.getElementById("matches");

    data.forEach(match => {
        let button = document.createElement("button");
        button.innerText = match.title + " - Watch Live";
        
        button.onclick = function() {
            fetch(`https://api.sportsrc.org/?data=detail&category=football&id=${match.id}`)
            .then(res => res.json())
            .then(detail => {
                container.innerHTML += detail.streams[0].embed;
            });
        };

        container.appendChild(button);
        container.appendChild(document.createElement("br"));
    });
});
</script>

</body>
</html>
