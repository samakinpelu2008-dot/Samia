<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPE Department App</title>

<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #f4f6f9;
}

/* Top Navbar */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: #DA291C;
  padding: 10px 15px;
  color: white;
  position: sticky;
  top: 0;
  z-index: 100;
}

.left-section, .center-section, .right-section {
  display: flex;
  align-items: center;
}

.hamburger {
  font-size: 24px;
  cursor: pointer;
  margin-right: 10px;
}

.center-section {
  flex: 1;
  display: flex;
  justify-content: center;
}

.logo-container {
  display: flex;
  align-items: center;
}

.logo {
  height: 45px;
  width: auto;
  margin-right: 10px;
}

.club-name {
  font-size: 22px;
  font-weight: bold;
  font-family: 'Arial Black', Gadget, sans-serif;
}

.right-section .account {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid white;
}

.account img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.search-icon {
  cursor: pointer;
  margin-left: 5px;
  display: flex;
  align-items: center;
}

/* Full-page Hamburger Menu */
.hamburger-menu {
  display: none;
  position: fixed;
  inset: 0;
  background-color: #DA291C;
  color: white;
  z-index: 999;
  flex-direction: column;
}

.hamburger-menu.active {
  display: flex;
}

/* Menu Top */
.menu-top {
  position: relative;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.menu-logo-container {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
}

.menu-logo-container .logo {
  height: 45px;
  width: auto;
}

/* X ICON */
.close-icon {
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
}

.close-icon svg {
  width: 22px;
  height: 22px;
  stroke: white;
}

/* Separator */
.separator {
  width: 90%;
  height: 2px;
  background-color: white;
  margin: 5px auto 20px auto;
}

/* Menu Items */
.menu-items {
  display: flex;
  flex-direction: column;
  gap: 20px;
  font-size: 22px;
  font-family: 'Arial Black', Gadget, sans-serif;
  padding-left: 20px;
}

.menu-items a {
  color: white;
  text-decoration: none;
}

.menu-items a:hover {
  color: #FFD700;
}

/* ===== HOME PAGE CONTENT (White Area) ===== */

.home-content {
  padding: 20px;
}

.post {
  background: white;
  padding: 18px;
  margin-bottom: 18px;
  border-radius: 10px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

.post-title {
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 6px;
}

.post-date {
  font-size: 13px;
  color: gray;
  margin-bottom: 10px;
}

</style>
</head>
<body>

<!-- Navbar -->
<div class="topbar">
  <div class="left-section">
    <div class="hamburger" onclick="openMenu()">&#9776;</div>

    <div class="search-icon">
      <i data-lucide="search"></i>
    </div>
  </div>

  <div class="center-section">
    <div class="logo-container">
      <img src="https://i.ibb.co/pBYWJ1F6/1000208244.png" class="logo">
      <div class="club-name">CPE</div>
    </div>
  </div>

  <div class="right-section">
    <div class="account">
      <img src="https://i.ibb.co/0sZgxFD/profile-placeholder.png">
    </div>
  </div>
</div>

<!-- ===== WHITE HOME PAGE SECTION ===== -->
<div id="home-content" class="home-content"></div>

<!-- Hamburger Menu -->
<div class="hamburger-menu" id="hamburgerMenu">
  <div class="menu-top">
    <div class="menu-logo-container">
      <img src="https://i.ibb.co/pBYWJ1F6/1000208244.png" class="logo">
    </div>

    <div class="close-icon" onclick="closeMenu()">
      <i data-lucide="x"></i>
    </div>
  </div>

  <div class="separator"></div>

  <div class="menu-items">
    <a href="#">Home</a>
    <a href="#">News</a>
    <a href="#">Fixtures</a>
    <a href="#">Results</a>
    <a href="#">Live</a>
    <a href="#">Chat Hall</a>
    <a href="#">CpeTV</a>
    <a href="#">Players</a>
    <a href="#">FANS</a>
    <a href="#">CPE GIRLS</a>
    <a href="#">JOIN THE TEAM</a>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  lucide.createIcons();

  // ===== DYNAMIC POSTS =====
  const posts = [
    {
      title: "Welcome to CPE Department",
      date: "February 2026",
      content: "This is the official launch of the CPE Department App."
    },
    {
      title: "Upcoming Fixture",
      date: "March 2026",
      content: "CPE vs Electrical Department. Stay tuned!"
    },
    {
      title: "CpeTV Launch",
      date: "March 2026",
      content: "CpeTV will stream all major matches live."
    }
  ];

  const homeContainer = document.getElementById("home-content");

  posts.forEach(post => {
    const postDiv = document.createElement("div");
    postDiv.classList.add("post");

    postDiv.innerHTML = `
      <div class="post-title">${post.title}</div>
      <div class="post-date">${post.date}</div>
      <div>${post.content}</div>
    `;

    homeContainer.appendChild(postDiv);
  });
});

function openMenu() {
  document.getElementById("hamburgerMenu").classList.add("active");
}

function closeMenu() {
  document.getElementById("hamburgerMenu").classList.remove("active");
}
</script>

</body>
</html>
