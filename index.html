<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPE Department App - Logo Test</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
    }

    /* Top Navbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #DA291C; /* Updated Manchester United red */
      padding: 10px 15px;
      color: white;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .left-section, .center-section, .right-section {
      display: flex;
      align-items: center;
    }

    /* Hamburger menu */
    .hamburger {
      font-size: 24px;
      cursor: pointer;
      margin-right: 10px;
    }

    /* Search icon */
    .search {
      font-size: 20px;
      cursor: pointer;
    }

    /* Center logo + name */
    .logo-container {
      display: flex;
      align-items: center;
      background-color: transparent; /* remove any block background */
    }

    .logo {
      height: 60px; /* bigger logo */
      width: 60px;  /* square to keep aspect */
      margin-right: 10px;
      border-radius: 50%; /* makes it circular */
      border: 2px solid white; /* optional: adds nice outline */
      box-shadow: 0 2px 5px rgba(0,0,0,0.3); /* subtle depth */
    }

    .club-name {
      font-size: 22px;
      font-weight: bold;
      color: white;
    }

    /* Account placeholder */
    .account {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid white;
    }

    .account img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="left-section">
      <div class="hamburger">&#9776;</div>
      <div class="search">&#128269;</div>
    </div>

    <div class="center-section">
      <div class="logo-container">
        <img src="https://i.ibb.co/Ndthyk90/1000208202.png" alt="Club Logo" class="logo">
        <div class="club-name">CPE</div>
      </div>
    </div>

    <div class="right-section">
      <div class="account" onclick="handleAccountClick()">
        <img src="https://via.placeholder.com/35/FFFFFF/FFFFFF?text=+" alt="Account">
      </div>
    </div>
  </div>

  <div style="padding:20px;">
    <p>Scroll down to test sticky navbar.</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>
    <p style="margin-bottom:1000px;"></p>
  </div>

  <script>
    function handleAccountClick() {
      alert("Account clicked. Later will redirect to login/dashboard.");
    }
  </script>

</body>
</html>
